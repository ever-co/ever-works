# yaml-language-server: $schema=https://api.ever.works/api/schema/works.yml.schema.json
#
# DRAFT App Blueprint — seed content of the Blueprint repository `ever-works/ever-traduora-template`.
# Shape: docs/specs/features/app-works/CONTRACTS.md §1. Validated in blueprint mode by
# packages/agent/src/works-config/schema/__tests__/product-blueprints.spec.ts (zero errors, as the
# Blueprint resolver requires before it lists a repository).
#
# Ever Traduora, the translation management platform, as an App: the upstream's own published
# image, one web component, its database a SQLite file on a volume (the image's default engine),
# no App dependency. Facts were read on 2026-11-20 from ever-co/ever-traduora (branch `develop`,
# API version 0.24.0) and from the image's registry metadata; sources are cited in ../README.md.
# "Verified" means read in source or registry metadata, not yet run.

version: 2
kind: app
name: Ever Traduora

spec:
  source:
    relation: fork
    upstream: { repo: ever-co/ever-traduora, defaultBranch: develop } # verified: default branch
    branch: develop

  blueprint:
    id: ever-traduora
    version: 0.1.0
    repo: ever-works/ever-traduora-template
    sha: '0000000000000000000000000000000000000000' # TODO(release): stamped by the release workflow

  license:
    spdx: AGPL-3.0-only # verified: repository licence metadata (AGPL-3.0)
    class: green
    source: blueprint

  display:
    name: Ever Traduora
    protectedPaths: [LICENSE]

  build:
    strategy: image
    # verified: the `prod` tag of the upstream's image pointed at this index digest on 2026-11-20
    # (linux/amd64). Pin by digest; a tag can move.
    image: ghcr.io/ever-co/ever-traduora@sha256:f1431ecc9bb4fe03521be01ec72d98a6d944734666adc0621737180a3e18c7b3

  components:
    - name: web
      role: web
      # No command: the image's entrypoint (`docker-entrypoint.sh`) runs `node src/main.js`, which
      # migrates the database on start (TR_DB_AUTOMIGRATE defaults to true).
      port: 8080 # verified: EXPOSE 8080; the server listens on 0.0.0.0:TR_PORT (default 8080)
      # verified: the image sets no USER (it would run as root); `node` is uid 1000 in the
      # node:alpine base, and runAsNonRoot needs a numeric uid.
      runAsUser: 1000
      replicas: 1 # one writer for the SQLite file
      writableRootFilesystem: true # TODO(verify): try false on the first verification run
      probes:
        startup: { http: /health, periodSeconds: 5, failureThreshold: 60 } # migrations on first boot
        readiness: { http: /health } # verified: GET /health returns {"status":"ok","version":…}
        liveness: { http: /health, periodSeconds: 30 }
      resources: { cpu: 250m, memory: 512Mi, memoryLimit: 1Gi } # TODO(verify): measure
      volumes: [{ name: data, path: /data, size: 1Gi, backup: true }]

  env:
    # verified: `better-sqlite3` is the default engine; the file path is TR_DB_DATABASE.
    - { name: TR_DB_TYPE, value: better-sqlite3 }
    - { name: TR_DB_DATABASE, value: /data/traduora.sqlite3 }
    - name: TR_SECRET # verified: required in production, published example values refused
      secret: true
      generate: { kind: hex, bytes: 32, rotate: never }
    - { name: TR_VIRTUAL_HOST, from: domains.primary.url } # links in invitation e-mails
    # The image sets a 12 GiB heap ceiling; keep it inside the container's memory limit.
    - { name: NODE_OPTIONS, value: '--max-old-space-size=768' }
    # Privacy default: anonymous statistics stay off until the owner turns them on.
    - { name: TR_EVER_STATS_ENABLED, value: 'false' }

  domains:
    primaryComponent: web
    publicUrlEnv: [TR_VIRTUAL_HOST]
    onChange: restart

  smoke:
    - name: health
      http: { method: GET, path: /health }
      expect: { status: [200], bodyContains: ['"status":"ok"'] }
