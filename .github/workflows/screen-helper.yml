name: Screen Helper

# Desktop view & control (FL-07) — the native screen helper crate
# (`apps/node/native/ever-works-screen`): format, lint, unit + protocol tests,
# a release build and the reproducible release build, on Windows, Linux and
# macOS.
#
# WHEN IT RUNS: on a pull request that touches the crate (or this file), and
# on demand against any branch:
#   gh workflow run screen-helper.yml --ref <branch>
# It is NOT a required check, and the path filter keeps it off every other
# pull request, so it can never block one. Linux and macOS: GitHub-hosted
# runners (rustup is preinstalled on both images). Windows: our own machines
# since 2026-11-05 (see runs-on below); the setup step gives them rustup and
# PowerShell 7. The crate needs no secrets. History: the crate was written without a Rust toolchain and
# first compiled on 2026-10-27; until then this workflow was dispatch-only.
#
# The reproducible release builds are the ones publish-node.yml releases (Linux
# in the pinned container, both macOS targets, Windows), and `release-manifest`
# turns them into the manifest a node bakes in, as a dry run: a pull request
# that would break a node release fails here first.
on:
  pull_request:
    paths:
      - 'apps/node/native/ever-works-screen/**'
      - 'apps/node/screen-helper-release.js'
      - '.github/workflows/screen-helper.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Also run the reproducible release build (always runs on pull requests)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Windows runs on our own Windows machines (ever-co org variable
    # RUNNER_WINDOWS_X64, a JSON label list, owner rule 2026-11-04), except for
    # a pull request from a fork: that code never runs on our machines and
    # takes the hosted image, as do forks themselves (no variable there).
    runs-on: ${{ matrix.os == 'windows-latest' && vars.RUNNER_WINDOWS_X64 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.RUNNER_WINDOWS_X64) || matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/node/native/ever-works-screen
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Git Bash, PowerShell 7 and rustup on our own Windows runners; a no-op
      # on GitHub-hosted ones.
      - name: Self-hosted Windows setup
        if: runner.os == 'Windows'
        uses: ./.github/actions/self-hosted-windows-setup
        with:
          pwsh: 'true'
          rust: 'true'

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup --version
          rustup toolchain install
          rustup show
          cargo --version
          cargo clippy --version

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit and protocol tests
        run: cargo test --locked

      - name: Release build
        run: |
          cargo build --locked --release
          ./target/release/ever-works-screen --version

      - name: Also lint and build for Intel Macs
        if: ${{ runner.os == 'macOS' }}
        run: |
          rustup target add x86_64-apple-darwin
          cargo clippy --locked --all-targets --target x86_64-apple-darwin -- -D warnings
          cargo build --locked --release --target x86_64-apple-darwin
          file target/x86_64-apple-darwin/release/ever-works-screen

      # What publish-node.yml releases for linux-x64: the same bytes on any
      # machine with Docker (compare the printed sha256 with a local run).
      - name: Reproducible release build (Linux, pinned container)
        if: ${{ runner.os == 'Linux' && (github.event_name == 'pull_request' || inputs.release) }}
        run: bash ./build-release-linux.sh dist

      - name: Reproducible release build (macOS)
        if: ${{ runner.os == 'macOS' && (github.event_name == 'pull_request' || inputs.release) }}
        run: |
          bash ./build-release.sh dist
          SCREEN_HELPER_TARGET=darwin-x64 bash ./build-release.sh dist/darwin-x64

      - name: Reproducible release build (Windows)
        if: ${{ runner.os == 'Windows' && (github.event_name == 'pull_request' || inputs.release) }}
        shell: pwsh
        run: ./build-release.ps1 -OutDir dist

      # The signing scripts, exercised without any real identity: an ad hoc
      # signature on macOS, a throwaway self-signed certificate on Windows. A
      # real signature needs the owner's identity (FL-07 owner question 7).
      - name: Signing dry run (macOS, ad hoc)
        if: ${{ runner.os == 'macOS' && (github.event_name == 'pull_request' || inputs.release) }}
        env:
          SCREEN_HELPER_DRY_RUN: '1'
        run: bash ./sign-release.sh dist

      - name: Signing dry run (Windows, throwaway certificate)
        if: ${{ runner.os == 'Windows' && (github.event_name == 'pull_request' || inputs.release) }}
        shell: pwsh
        run: ./sign-release.ps1 -OutDir dist -DryRun

      # The unsigned build and its fingerprint, for inspection only: nothing is
      # published, and a helper reaches a node only through the owner-approved
      # release steps in PACKAGING.md.
      - name: Keep the unsigned build for inspection
        if: ${{ github.event_name == 'pull_request' || inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: ever-works-screen-${{ runner.os }}-unsigned
          path: |
            apps/node/native/ever-works-screen/dist/
            !apps/node/native/ever-works-screen/dist/signed/
          retention-days: 7
          if-no-files-found: error

  # The manifest a node release would bake from these builds (dry run of
  # apps/node/screen-helper-release.js, which build.js runs in publish-node.yml):
  # every target present, each binary hashing to its metadata.
  release-manifest:
    needs: verify
    if: ${{ github.event_name == 'pull_request' || inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the unsigned builds
        uses: actions/download-artifact@v8
        with:
          pattern: ever-works-screen-*-unsigned
          path: ${{ runner.temp }}/screen-helper

      - name: The manifest and release assets a node release would publish
        run: |
          node apps/node/screen-helper-release.js \
            --dir "$RUNNER_TEMP/screen-helper" \
            --url-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/node-v0.0.0-dry-run" \
            --require linux-x64,win32-x64,darwin-arm64,darwin-x64 \
            --out "$RUNNER_TEMP/release-assets"
          cat "$RUNNER_TEMP/release-assets/SHA256SUMS"
