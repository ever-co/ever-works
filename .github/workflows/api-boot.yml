name: API boot

# D-4 (Gauzy Ever Works #41) — a Nest DI failure is invisible to unit specs and to
# type-check: the API has broken at boot twice, and the DI reachability spec is
# structural only. This job builds the API and its workspace dependencies, starts
# `node dist/main.js` on an in-memory SQLite database (no Postgres, Redis or real
# credentials: the bare env below is enough to boot, checked from a directory with
# no `.env`), and asserts that
# `GET /api/health` answers 200. A provider the container cannot resolve makes the
# process exit during bootstrap, which fails the job with the log tail.
# A module behind a switch that is off by default is not in that graph, so the API is
# then booted once more with the switches of the routes that let another Ever app
# create and deploy an App for a person: the routes must exist (401 without a
# credential, where a module that is not there answers 404).
# Before the boot it also loads the built migrations through TypeORM's own loader
# (`scripts/check-migrations-load.cjs`): the boot runs on `synchronize`, so it cannot
# see a loader that silently finds no migration (prod from 2026-11-07, #3107).
# After the boots it runs the unit suites no other pull request check runs, each only when
# the change touches its code: the agent's App spec and App runtime suites, the k8s
# plugin's suites and the API's Ever Connect suites (see "Decide which unit suites").
on:
  pull_request:
    branches: [develop, stage, main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/api-boot.yml'
      - 'scripts/check-migrations-load.cjs'
  push:
    branches: [develop, stage, main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/api-boot.yml'
      - 'scripts/check-migrations-load.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    name: API boots on SQLite (/api/health 200)
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    # 30 for the build and the boots, plus room for the unit suites when a change needs all three.
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v3
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      # Same registry posture as ci.yml: the internal Verdaccio cache on the ARC pool,
      # npmjs otherwise (a fork PR has no secrets and lands on ubuntu-latest).
      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the API and its workspace dependencies
        run: pnpm turbo run build --filter=ever-works-api...

      # Prod applies migrations at boot through TypeORM's directory loader. From
      # 2026-11-07 (#3107) a minimatch override made that loader find 0 files, and the boot
      # below could not notice (it runs on `synchronize`). Load the BUILT
      # migrations the way prod does and require every compiled file to load.
      - name: TypeORM loads every built migration
        working-directory: apps/api
        run: node ../../scripts/check-migrations-load.cjs

      - name: Boot the API and wait for /api/health
        working-directory: apps/api
        env:
          DATABASE_TYPE: sqlite
          DATABASE_IN_MEMORY: 'true'
          DATABASE_AUTOMIGRATE: 'true'
          # Required at bootstrap (`config/constants.ts`). A CI-only fixture value, not a
          # secret: the booted API serves no traffic and is killed once healthy.
          AUTH_SECRET: api-boot-ci-only-fixture-value-not-a-secret-000000
          PORT: '3999'
        run: |
          node dist/main.js > "$RUNNER_TEMP/api-boot.log" 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:3999/api/health; then
              # Nothing is switched on in this boot, so a route behind a switch that is off
              # by default must not exist: the same request the boot below expects 401 for
              # answers 404 here. That tells a switch that gates its routes from routes
              # that are always there.
              OFF=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H 'content-type: application/json' -d '{}' \
                http://127.0.0.1:3999/api/ever-connect/apps)
              kill "$PID" || true
              if [ "$OFF" != "404" ]; then
                echo "::error::POST /api/ever-connect/apps answered $OFF with nothing switched on (expected 404: the route is behind a switch that is off by default)"
                exit 1
              fi
              echo "API healthy after $((i * 2)) s; POST /api/ever-connect/apps with nothing switched on: 404"
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::the API exited during boot (a DI or configuration failure); log tail below"
              tail -n 150 "$RUNNER_TEMP/api-boot.log"
              exit 1
            fi
            sleep 2
          done
          echo "::error::no 200 from /api/health within 180 s; log tail below"
          tail -n 150 "$RUNNER_TEMP/api-boot.log"
          kill "$PID" || true
          exit 1

      # The modules behind a switch are not in the graph of the boot above: a switched
      # module is imported only with its switch, so its providers are resolved for the
      # first time on the installation that turns it on. Boot once more with the switches
      # of the apps-write routes on. No connection and no credential is needed to build
      # the graph, and nothing is called while the installation is not connected (the
      # platform address below is a closed local port, to make that certain).
      # The routes must then exist: without a credential they answer 401, where a module
      # that is not there answers 404.
      - name: Boot the API with the apps-write routes switched on
        working-directory: apps/api
        env:
          DATABASE_TYPE: sqlite
          DATABASE_IN_MEMORY: 'true'
          DATABASE_AUTOMIGRATE: 'true'
          AUTH_SECRET: api-boot-ci-only-fixture-value-not-a-secret-000000
          PORT: '3998'
          EVER_CONNECT_ENABLED: 'true'
          EVER_CONNECT_APPS_WRITE_ENABLED: 'true'
          EVER_CONNECT_BLUEPRINT_HANDOFF_ENABLED: 'true'
          # A fixture client id, not a credential: the routes exist only with a list of
          # the apps that may write.
          EVER_ID_TRUSTED_CLIENT_IDS: api-boot-ci-fixture-client
          EVER_PLATFORM_API_URL: http://127.0.0.1:9
        run: |
          node dist/main.js > "$RUNNER_TEMP/api-boot-apps-write.log" 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:3998/api/health; then
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H 'content-type: application/json' -d '{}' \
                http://127.0.0.1:3998/api/ever-connect/apps)
              kill "$PID" || true
              if [ "$CODE" != "401" ]; then
                echo "::error::POST /api/ever-connect/apps answered $CODE without a credential (expected 401: the route exists and needs one); log tail below"
                tail -n 150 "$RUNNER_TEMP/api-boot-apps-write.log"
                exit 1
              fi
              echo "API healthy with the apps-write routes on after $((i * 2)) s; POST /api/ever-connect/apps without a credential: 401"
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::the API exited during boot with the apps-write routes switched on (a DI or configuration failure); log tail below"
              tail -n 150 "$RUNNER_TEMP/api-boot-apps-write.log"
              exit 1
            fi
            sleep 2
          done
          echo "::error::no 200 from /api/health within 180 s with the apps-write routes switched on; log tail below"
          tail -n 150 "$RUNNER_TEMP/api-boot-apps-write.log"
          kill "$PID" || true
          exit 1

      # No other pull request check runs these unit suites, and they are too slow to run on
      # every change: run each one only when the change touches its code.
      #   agent:   the agent's App spec and App runtime suites (Jest); the App Blueprint drafts
      #            are validated by the App spec suite `product-blueprints.spec.ts`
      #   k8s:     the k8s plugin's suites (Vitest) and its type-check
      #   connect: the API's Ever Connect suites (Jest)
      # The change is the diff from the pull request's base (a push: the commit before it, or
      # the first parent). Fails SAFE: an event without a base (workflow_dispatch), a base that
      # cannot be fetched, or a diff that fails or comes back empty runs every suite. Changing
      # only this file runs none: touch a file under a suite's paths to exercise its step.
      - name: Decide which unit suites this change needs
        id: suites
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -u
          all() {
            echo "-> $1: running every suite."
            { echo "agent=true"; echo "k8s=true"; echo "connect=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$EVENT_NAME" = "workflow_dispatch" ] && all "manual run"
          BASE="$BASE_SHA"
          case "$BASE" in ''|0000000000000000000000000000000000000000) BASE="" ;; esac
          if [ -z "$BASE" ]; then
            [ "$EVENT_NAME" = "push" ] || all "no base commit for a $EVENT_NAME event"
            BASE=$(git rev-parse -q --verify 'HEAD^1') || all "push without a parent commit"
          fi
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch -q --no-tags --depth=1 origin "$BASE" || true
          git cat-file -e "$BASE^{commit}" 2>/dev/null || all "base $BASE cannot be fetched"
          CHANGED=$(git diff --name-only "$BASE" HEAD) || all "git diff failed"
          [ -n "$CHANGED" ] || all "empty diff"
          echo "Changed files against $BASE:"; printf '%s\n' "$CHANGED" | sed 's/^/  /'
          decide() {
            if printf '%s\n' "$CHANGED" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"; echo "-> $1: run"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"; echo "-> $1: skip (no change under its paths)"
            fi
          }
          decide agent '^packages/agent/(src/(app-runtime|works-config)/|jest\.config\.js$|package\.json$)|^docs/specs/features/app-works/APW-13-golden-paths/blueprints/'
          decide k8s '^packages/plugins/k8s/'
          decide connect '^apps/api/(src/ever-connect/|jest\.config\.js$|package\.json$)'

      - name: 'Unit suites: agent App spec and App runtime (Jest)'
        if: steps.suites.outputs.agent == 'true'
        working-directory: packages/agent
        run: npx jest --ci --maxWorkers=2 src/works-config/ src/app-runtime/

      - name: 'Unit suites: k8s plugin (type-check, Vitest)'
        if: steps.suites.outputs.k8s == 'true'
        working-directory: packages/plugins/k8s
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx vitest run

      - name: 'Unit suites: API Ever Connect (Jest)'
        if: steps.suites.outputs.connect == 'true'
        working-directory: apps/api
        run: node node_modules/jest/bin/jest.js --ci --maxWorkers=2 src/ever-connect/
