name: Publish Node

# Builds the headless fleet node (`apps/node`) into a single-file bundle and
# publishes it to npm as the PUBLIC package `ever-works-node`, so a machine
# joins the fleet with `npm install -g ever-works-node` instead of a
# monorepo checkout. See `apps/node/build.js` for what the bundle contains.
#
# Triggers:
#   - a `node-v*` tag (e.g. `node-v0.2.0`) publishes that version, with an
#     npm provenance attestation, and is the ONLY path that publishes;
#   - manual dispatch is a dry run: build, smoke-test, `npm publish --dry-run`.
#
# Release flow: bump `apps/node/package.json` AND `apps/node/src/version.ts`
# together in a PR (`src/version.spec.ts` pins them to each other), merge it,
# then tag the merge commit `node-v<version>`. The tag must equal the
# package version, so every published version maps to exactly one commit.
#
# The screen helper (FL-07, `apps/node/native/ever-works-screen`) ships with
# every release: `screen-helper` builds it reproducibly for each target, `build`
# bakes each build's SHA-256 and download URL into the bundle (the manifest
# `ever-works-node helper install` checks a download against), and
# `release-screen-helper` hosts the binaries as assets of this tag's GitHub
# release (`https://github.com/<repo>/releases/download/node-v<version>/...`)
# BEFORE npm publishes the package that points at them. Only the job token is
# needed (`contents: write` there). The targets are the four below unless the
# repository variable SCREEN_HELPER_RELEASE_TARGETS (a JSON list, e.g.
# '["linux-x64","win32-x64"]' on an engine with no macOS runner) narrows them;
# `build` then requires exactly those, so a target is never dropped silently.

on:
  push:
    tags:
      - 'node-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screen-helper:
    name: screen helper (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        # Keep in step with SCREEN_HELPER_REQUIRED_TARGETS in the build job.
        target: ${{ fromJSON(vars.SCREEN_HELPER_RELEASE_TARGETS || '["linux-x64","win32-x64","darwin-arm64","darwin-x64"]') }}
    # linux-x64 builds in a pinned container (Docker), so any Linux runner gives the
    # same bytes; both macOS targets on Apple silicon (darwin-x64 cross-built).
    # win32-x64 is built on a FRESH machine: the hosted image, or the label list in
    # RUNNER_WINDOWS_X64_RELEASE (JSON) for Windows machines kept for releases. Not
    # on RUNNER_WINDOWS_X64: those desktops also run pull requests' cargo builds as
    # SYSTEM with a persistent toolchain, and whatever a release builds there is
    # baked in as the published Windows helper.
    runs-on: ${{ matrix.target == 'linux-x64' && (vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest') || matrix.target == 'win32-x64' && (vars.RUNNER_WINDOWS_X64_RELEASE && fromJSON(vars.RUNNER_WINDOWS_X64_RELEASE) || 'windows-latest') || 'macos-latest' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: apps/node/native/ever-works-screen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Git Bash, PowerShell 7 and rustup on our own Windows runners; a no-op
      # on GitHub-hosted ones.
      - name: Self-hosted Windows setup
        if: runner.os == 'Windows'
        uses: ./.github/actions/self-hosted-windows-setup
        with:
          pwsh: 'true'
          rust: 'true'

      - name: Install the pinned toolchain (rust-toolchain.toml)
        if: matrix.target != 'linux-x64'
        run: |
          rustup toolchain install
          rustup show

      - name: Reproducible release build (linux-x64, pinned container)
        if: matrix.target == 'linux-x64'
        run: bash ./build-release-linux.sh dist

      - name: Reproducible release build (macOS)
        if: startsWith(matrix.target, 'darwin-')
        env:
          SCREEN_HELPER_TARGET: ${{ matrix.target }}
        run: bash ./build-release.sh dist

      - name: Reproducible release build (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: ./build-release.ps1 -OutDir dist

      - name: Check the build is the ${{ matrix.target }} helper
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cat dist/unsigned-release-metadata.json
          grep -Eq "\"target\": *\"$TARGET\"" dist/unsigned-release-metadata.json || {
            echo "::error::this runner built another target than $TARGET"
            exit 1
          }

      - name: Keep the build for the bundle and the release
        uses: actions/upload-artifact@v7
        with:
          name: screen-helper-${{ matrix.target }}
          path: |
            apps/node/native/ever-works-screen/dist/ever-works-screen
            apps/node/native/ever-works-screen/dist/ever-works-screen.exe
            apps/node/native/ever-works-screen/dist/unsigned-release-metadata.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: screen-helper
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v3
        with:
          version: 10.33.3

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/node-v')
        working-directory: apps/node
        run: |
          tag="${GITHUB_REF#refs/tags/node-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag node-v$tag does not match apps/node/package.json version $pkg" >&2
            exit 1
          fi

      - name: Build the node and its workspace dependencies
        run: npx turbo build --filter=ever-works-node...

      - name: Type-check the node
        working-directory: apps/node
        run: npx tsc --noEmit

      # Deterministic gates only. The full apps/node suite — including the
      # real-process timing specs — runs in ci.yml on every PR; a release
      # must not be blocked by a timing flake with no retry path but re-tagging.
      - name: Run the deterministic node gates
        working-directory: apps/node
        run: npx vitest run src/version.spec.ts src/cli/program.spec.ts src/cli/program.workspace-root.spec.ts

      - name: Download the screen helper builds
        uses: actions/download-artifact@v8
        with:
          pattern: screen-helper-*
          path: ${{ runner.temp }}/screen-helper

      # Bakes each helper build's SHA-256 and URL into cli.js and stages the
      # binaries under their release names in apps/node/dist-screen-helper/.
      - name: Stage the publishable bundle
        working-directory: apps/node
        env:
          SCREEN_HELPER_RELEASE_DIR: ${{ runner.temp }}/screen-helper
          # Keep in step with the screen-helper matrix.
          SCREEN_HELPER_REQUIRED_TARGETS: ${{ join(fromJSON(vars.SCREEN_HELPER_RELEASE_TARGETS || '["linux-x64","win32-x64","darwin-arm64","darwin-x64"]'), ',') }}
        run: |
          version="$(node -p "require('./package.json').version")"
          export SCREEN_HELPER_URL_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/node-v${version}"
          pnpm build:bundle
          cat dist-bundle/helper-manifest.json
          cat dist-screen-helper/SHA256SUMS

      - name: Smoke-test the bundle
        working-directory: apps/node/dist-bundle
        run: |
          node cli.js --version
          node cli.js capabilities
          # An un-enrolled node must report exit code 3 (the documented "not enrolled").
          set +e
          EVER_WORKS_NODE_CONFIG="$(mktemp -d)/node-config.json" node cli.js status
          code=$?
          set -e
          if [ "$code" != "3" ]; then echo "expected exit 3 for an un-enrolled node, got $code" >&2; exit 1; fi
          # The baked manifest publishes this runner's helper (linux-x64) when the release builds it.
          status="$(EVER_WORKS_NODE_CONFIG="$(mktemp -d)/node-config.json" node cli.js helper status --json)"
          echo "$status"
          if grep -q '"linux-x64"' helper-manifest.json; then
            echo "$status" | grep -q '"manifestPublishesThisTarget":true' || {
              echo "the bundle does not publish the linux-x64 screen helper it was built with" >&2
              exit 1
            }
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ever-works-node-bundle
          path: apps/node/dist-bundle/

      - name: Upload the screen helper release assets
        uses: actions/upload-artifact@v7
        with:
          name: ever-works-node-screen-helper
          path: apps/node/dist-screen-helper/
          if-no-files-found: error

  # Hosts the screen helper binaries where the baked manifest points: assets
  # of this tag's GitHub release. Runs before npm publishes, so a published
  # package never names a download that does not exist yet. The release is
  # created as a draft and published only once every asset is there (an org
  # that turns on immutable releases cannot add assets to a published one).
  # Safe to re-run FAILED jobs: an asset already there is compared with the
  # build, never replaced. "Re-run all jobs" rebuilds the macOS and Windows
  # helpers, which may then differ in bytes and stop here (nothing wrong is
  # published; delete the draft's assets by hand to start over). A dispatch
  # (dry run) only checks and lists them.
  release-screen-helper:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download the screen helper release assets
        uses: actions/download-artifact@v8
        with:
          name: ever-works-node-screen-helper
          path: screen-helper/

      - name: Download the bundle npm will publish
        uses: actions/download-artifact@v8
        with:
          name: ever-works-node-bundle
          path: bundle/

      # The assets are the bytes the bundle's baked fingerprints name: the
      # manifest beside cli.js is the asset copy, and every SHA-256 is in cli.js.
      - name: Check them against the fingerprints baked into the bundle
        run: |
          set -euo pipefail
          (cd screen-helper && sha256sum --check --strict SHA256SUMS)
          cmp bundle/helper-manifest.json screen-helper/helper-manifest.json
          while read -r sha file; do
            grep -qF "$sha" bundle/cli.js || { echo "::error::$file ($sha) is not baked into cli.js"; exit 1; }
          done < screen-helper/SHA256SUMS
          cat screen-helper/helper-manifest.json

      - name: Host them on the GitHub release of this tag
        if: startsWith(github.ref, 'refs/tags/node-v')
        working-directory: screen-helper
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if ! gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            {
              echo "The fleet node ever-works-node ${TAG#node-v} (npm). The assets are the native screen helper"
              echo "builds this version publishes; the node downloads and checks them itself:"
              echo
              echo '```'
              echo 'ever-works-node helper install'
              echo 'ever-works-node helper admit'
              echo '```'
              echo
              echo 'SHA-256 (the same fingerprints are baked into the package, see helper-manifest.json):'
              echo
              echo '```'
              cat SHA256SUMS
              echo '```'
            } > "$RUNNER_TEMP/notes.md"
            # A draft until every asset is there. Not "Latest": that stays with
            # the platform's own releases.
            gh release create "$TAG" --repo "$repo" --verify-tag --draft --latest=false \
              --title "ever-works-node ${TAG#node-v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          existing="$(gh release view "$TAG" --repo "$repo" --json assets --jq '.assets[].name')"
          for file in *; do
            if grep -qxF "$file" <<<"$existing"; then
              check="$(mktemp -d)"
              gh release download "$TAG" --repo "$repo" --pattern "$file" --dir "$check"
              if ! cmp -s "$file" "$check/$file"; then
                echo "::error::$TAG already hosts a different $file; nothing was replaced. Delete that asset by hand if it is wrong, then re-run."
                exit 1
              fi
              echo "$file: already hosted, identical"
            else
              gh release upload "$TAG" "$file" --repo "$repo"
              echo "$file: uploaded"
            fi
          done
          if [ "$(gh release view "$TAG" --repo "$repo" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "$TAG" --repo "$repo" --draft=false --latest=false
            echo "published the release $TAG"
          fi

      - name: Dry run (dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/node-v') }}
        working-directory: screen-helper
        run: |
          echo "A node-v* tag would host these on its GitHub release:"
          ls -l

  publish:
    needs: [build, release-screen-helper]
    # GitHub-HOSTED on purpose. npm verifies the provenance bundle and refuses one minted on a
    # self-hosted runner: the first real release (node-v0.2.0, run 37966885221) failed with
    # `E422 ... Unsupported GitHub Actions runner environment: "self-hosted". Only "github-hosted"
    # runners are supported when publishing with provenance.` The heavy build stays on our ARC
    # runners; this job only downloads the staged bundle and runs `npm publish`, so it is cheap.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm provenance: the registry verifies the OIDC token against this
      # workflow run, so the published package carries a signed attestation
      # of the exact commit and workflow that built it.
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          # setup-node writes the registry + NODE_AUTH_TOKEN wiring into its
          # own npmrc (NPM_CONFIG_USERCONFIG); nothing else needs configuring.
          registry-url: 'https://registry.npmjs.org'

      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: ever-works-node-bundle
          path: dist-bundle/

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        working-directory: dist-bundle
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (public, with provenance)
        if: startsWith(github.ref, 'refs/tags/node-v')
        working-directory: dist-bundle
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
