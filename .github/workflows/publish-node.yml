name: Publish Node

# Builds the headless fleet node (`apps/node`) into a single-file bundle and
# publishes it to npm as the PUBLIC package `ever-works-node`, so a machine
# joins the fleet with `npm install -g ever-works-node` instead of a
# monorepo checkout. See `apps/node/build.js` for what the bundle contains.
#
# Triggers:
#   - a `node-v*` tag push (e.g. `node-v0.2.0`) publishes that version, and is
#     the ONLY path that publishes. The tagged commit must already be merged
#     into main or develop, so an unmerged branch commit cannot be released:
#     `build` checks that first and fails otherwise. This does not prove a
#     review (admins can merge without one: enforce_admins is off on both); a
#     real review gate needs enforce_admins on develop and main plus a tag
#     ruleset for `node-v*` (owner decision);
#   - manual dispatch is a dry run, also on a `node-v*` tag ref: build,
#     smoke-test, `npm publish --dry-run`. The publishing steps below test
#     `github.event_name == 'push'` as well as the ref.
#
# Where it runs: in our cluster, not on GitHub Actions (owner, 2026-11-11: the
# org's Actions billing block is permanent). The ci-builds engine (Argo
# Workflows + act, `ever-co/k8s-gitops` apps/ci-builds) runs this file unchanged
# for every `node-v*` tag (catalog `tags`), all jobs in one pod, artifacts on
# act's own server. A dry run by hand:
#   python scripts/ci-builds-run.py ever-co/ever-works <branch> publish-node.yml 4 --event workflow_dispatch --no-push
# (homelab repo). npm provenance needs GitHub's OIDC token, which only a
# GitHub-hosted runner has, so an in-cluster release publishes without it.
# On GitHub the jobs run only in forks: `build` is gated like the jobs of
# screen-helper.yml (#3174) and the other two need it. Back on GitHub in
# ever-co takes both `stay` for this file in k8s-gitops
# apps/ci-builds/tools/policy-overrides.json (else the Actions enforcer keeps
# it disabled there) and repo variable RUN_ON_ACTIONS = 'true'; a tag would
# then also run here, and the two runs would race to publish.
#
# Release flow: bump `apps/node/package.json` AND `apps/node/src/version.ts`
# together in a PR (`src/version.spec.ts` pins them to each other), merge it,
# then tag the merge commit `node-v<version>`. The tag must equal the
# package version, so every published version maps to exactly one commit, and
# that commit must already be on develop or main.
#
# The screen helper (FL-07, `apps/node/native/ever-works-screen`) ships with
# every release, for linux-x64 and win32-x64: `build` builds both reproducibly
# in a pinned Linux container (Docker; the same bytes on any machine; Windows
# cross-compiled with a pinned mingw-w64) and bakes their SHA-256 and download
# URLs into the bundle (the manifest `ever-works-node helper install` checks a
# download against), and `release-screen-helper` hosts them as assets of this
# tag's GitHub release
# (`https://github.com/<repo>/releases/download/node-v<version>/...`) BEFORE npm
# publishes the package that points at them. Release assets of this public
# repository: no Actions storage, uploaded with the build's own token. The
# macOS helpers need a macOS build machine, which the in-cluster engine does
# not have: until one builds them, Macs keep building and admitting the helper
# themselves (PACKAGING.md).

on:
  push:
    tags:
      - 'node-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # In ever-co this runs in-cluster only (vars.CI_IN_CLUSTER), unless repo
    # variable RUN_ON_ACTIONS is 'true'. Forks run it on their own Actions.
    # release-screen-helper and publish need this job, so they skip with it.
    if: vars.CI_IN_CLUSTER == 'true' || github.repository_owner != 'ever-co' || vars.RUN_ON_ACTIONS == 'true'
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only a merged commit is released: a `node-v*` tag on a commit not yet
      # merged into main or develop (an unmerged branch, a tag pushed with a
      # leaked token) fails here, before anything is built, hosted or
      # published. Releases are tagged on develop's merge commit (node-v0.2.12)
      # or on main. It does not prove the commit was reviewed: admins can merge
      # without an approval (enforce_admins is off), so a real review gate
      # needs enforce_admins on both branches plus a tag ruleset for `node-v*`.
      - name: Check the tagged commit is on main or develop
        if: startsWith(github.ref, 'refs/tags/node-v')
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          git fetch --no-tags --quiet origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/develop:refs/remotes/origin/develop'
          for branch in main develop; do
            if git merge-base --is-ancestor "$commit" "refs/remotes/origin/$branch"; then
              echo "$GITHUB_REF_NAME ($commit) is on $branch"
              exit 0
            fi
          done
          echo "::error::$GITHUB_REF_NAME points at $commit, which is on neither main nor develop: only a merged commit is released. Delete the tag and tag the merge commit instead."
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v3
        with:
          version: 10.33.3

      - name: Setup Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/node-v')
        working-directory: apps/node
        run: |
          tag="${GITHUB_REF#refs/tags/node-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag node-v$tag does not match apps/node/package.json version $pkg" >&2
            exit 1
          fi

      - name: Build the node and its workspace dependencies
        run: npx turbo build --filter=ever-works-node...

      - name: Type-check the node
        working-directory: apps/node
        run: npx tsc --noEmit

      # Deterministic gates only. The full apps/node suite — including the
      # real-process timing specs — runs in ci.yml on every PR; a release
      # must not be blocked by a timing flake with no retry path but re-tagging.
      - name: Run the deterministic node gates
        working-directory: apps/node
        run: npx vitest run src/version.spec.ts src/cli/program.spec.ts src/cli/program.workspace-root.spec.ts

      # Two clean builds, compared, in rust:1.88.0-slim-bookworm pinned by
      # digest, from the committed tree: prints the SHA-256 anyone can check
      # by running the same script at this commit.
      - name: Reproducible release build of the screen helper (linux-x64, pinned container)
        working-directory: apps/node/native/ever-works-screen
        run: bash ./build-release-linux.sh dist/linux-x64

      # The same container, plus the mingw-w64 cross toolchain at exact
      # versions from snapshot.debian.org: x86_64-pc-windows-gnu, two clean
      # builds compared, a PE without a link timestamp.
      - name: Reproducible release build of the screen helper (win32-x64, cross-compiled in the pinned container)
        working-directory: apps/node/native/ever-works-screen
        env:
          SCREEN_HELPER_TARGET: win32-x64
        run: bash ./build-release-linux.sh dist/win32-x64

      # Bakes each helper build's SHA-256 and URL into cli.js and stages the
      # binaries under their release names in apps/node/dist-screen-helper/.
      - name: Stage the publishable bundle
        working-directory: apps/node
        env:
          SCREEN_HELPER_RELEASE_DIR: native/ever-works-screen/dist
          SCREEN_HELPER_REQUIRED_TARGETS: linux-x64,win32-x64
        run: |
          version="$(node -p "require('./package.json').version")"
          export SCREEN_HELPER_URL_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/node-v${version}"
          pnpm build:bundle
          cat dist-bundle/helper-manifest.json
          cat dist-screen-helper/SHA256SUMS

      - name: Smoke-test the bundle
        working-directory: apps/node/dist-bundle
        run: |
          node cli.js --version
          node cli.js capabilities
          # An un-enrolled node must report exit code 3 (the documented "not enrolled").
          set +e
          EVER_WORKS_NODE_CONFIG="$(mktemp -d)/node-config.json" node cli.js status
          code=$?
          set -e
          if [ "$code" != "3" ]; then echo "expected exit 3 for an un-enrolled node, got $code" >&2; exit 1; fi
          # The baked manifest publishes this runner's helper (linux-x64) when the release builds it.
          status="$(EVER_WORKS_NODE_CONFIG="$(mktemp -d)/node-config.json" node cli.js helper status --json)"
          echo "$status"
          if grep -q '"linux-x64"' helper-manifest.json; then
            echo "$status" | grep -q '"manifestPublishesThisTarget":true' || {
              echo "the bundle does not publish the linux-x64 screen helper it was built with" >&2
              exit 1
            }
          fi
          # And the Windows helper, which this runner cannot start (proven on Windows, see PACKAGING.md).
          node -e '
            const { targets } = require("./helper-manifest.json");
            for (const target of ["linux-x64", "win32-x64"]) {
              if (!targets[target]) { console.error("the bundle does not publish the " + target + " screen helper"); process.exit(1); }
            }
            if (!targets["win32-x64"].url.endsWith("-win32-x64.exe")) { console.error("the win32-x64 helper URL does not name an .exe"); process.exit(1); }'

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ever-works-node-bundle
          path: apps/node/dist-bundle/

      - name: Upload the screen helper release assets
        uses: actions/upload-artifact@v7
        with:
          name: ever-works-node-screen-helper
          path: apps/node/dist-screen-helper/
          if-no-files-found: error

  # Hosts the screen helper binaries where the baked manifest points: assets
  # of this tag's GitHub release. Runs before npm publishes, so a published
  # package never names a download that does not exist yet. The release is
  # created as a draft and published only once every asset is there (an org
  # that turns on immutable releases cannot add assets to a published one).
  # Safe to re-run FAILED jobs: an asset already there is compared with the
  # build, never replaced. "Re-run all jobs" rebuilds the helpers; both builds
  # are reproducible, so the same commit gives the same bytes and passes. A
  # build that differs (another image, toolchain or commit) stops here and
  # nothing wrong is published (delete the draft's assets by hand to start
  # over). A dispatch (dry run) only checks and lists them.
  release-screen-helper:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download the screen helper release assets
        uses: actions/download-artifact@v8
        with:
          name: ever-works-node-screen-helper
          path: screen-helper/

      - name: Download the bundle npm will publish
        uses: actions/download-artifact@v8
        with:
          name: ever-works-node-bundle
          path: bundle/

      # The assets are the bytes the bundle's baked fingerprints name: the
      # manifest beside cli.js is the asset copy, and every SHA-256 is in cli.js.
      - name: Check them against the fingerprints baked into the bundle
        run: |
          set -euo pipefail
          (cd screen-helper && sha256sum --check --strict SHA256SUMS)
          cmp bundle/helper-manifest.json screen-helper/helper-manifest.json
          while read -r sha file; do
            grep -qF "$sha" bundle/cli.js || { echo "::error::$file ($sha) is not baked into cli.js"; exit 1; }
          done < screen-helper/SHA256SUMS
          cat screen-helper/helper-manifest.json

      # A tag push only: a dispatch on a tag ref is a dry run like any other.
      - name: Host them on the GitHub release of this tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-v')
        working-directory: screen-helper
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if ! gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            {
              echo "The fleet node ever-works-node ${TAG#node-v} (npm). The assets are the native screen helper"
              echo "builds this version publishes; the node downloads and checks them itself:"
              echo
              echo '```'
              echo 'ever-works-node helper install'
              echo 'ever-works-node helper admit'
              echo '```'
              echo
              echo 'SHA-256 (the same fingerprints are baked into the package, see helper-manifest.json):'
              echo
              echo '```'
              cat SHA256SUMS
              echo '```'
            } > "$RUNNER_TEMP/notes.md"
            # A draft until every asset is there. Not "Latest": that stays with
            # the platform's own releases.
            gh release create "$TAG" --repo "$repo" --verify-tag --draft --latest=false \
              --title "ever-works-node ${TAG#node-v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          existing="$(gh release view "$TAG" --repo "$repo" --json assets --jq '.assets[].name')"
          for file in *; do
            if grep -qxF "$file" <<<"$existing"; then
              check="$(mktemp -d)"
              gh release download "$TAG" --repo "$repo" --pattern "$file" --dir "$check"
              if ! cmp -s "$file" "$check/$file"; then
                echo "::error::$TAG already hosts a different $file; nothing was replaced. Delete that asset by hand if it is wrong, then re-run."
                exit 1
              fi
              echo "$file: already hosted, identical"
            else
              gh release upload "$TAG" "$file" --repo "$repo"
              echo "$file: uploaded"
            fi
          done
          if [ "$(gh release view "$TAG" --repo "$repo" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "$TAG" --repo "$repo" --draft=false --latest=false
            echo "published the release $TAG"
          fi

      - name: Dry run (dispatch)
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-v')) }}
        working-directory: screen-helper
        run: |
          echo "A node-v* tag would host these on its GitHub release:"
          ls -l

  publish:
    needs: [build, release-screen-helper]
    # On GitHub this had to be GitHub-HOSTED: npm verifies the provenance bundle and refuses one
    # minted on a self-hosted runner (node-v0.2.0, run 37966885221: `E422 ... Unsupported GitHub
    # Actions runner environment: "self-hosted"`). In the cluster there is no OIDC token at all,
    # so the publish step below leaves provenance out there.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm provenance: the registry verifies the OIDC token against this
      # workflow run, so the published package carries a signed attestation
      # of the exact commit and workflow that built it.
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          # setup-node writes the registry + NODE_AUTH_TOKEN wiring into its
          # own npmrc (NPM_CONFIG_USERCONFIG); nothing else needs configuring.
          registry-url: 'https://registry.npmjs.org'

      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: ever-works-node-bundle
          path: dist-bundle/

      - name: Publish (dry run)
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-v')) }}
        working-directory: dist-bundle
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # With a provenance attestation where GitHub's OIDC token exists (a
      # GitHub-hosted runner); without one in the cluster, where `--provenance`
      # fails (node-v0.2.11, 2026-11-10: `Provenance generation in GitHub
      # Actions requires "write" access to the "id-token" permission`).
      - name: Publish to npm (public)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-v')
        working-directory: dist-bundle
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            npm publish --access public --provenance
          else
            echo "::notice::no GitHub OIDC token here (in-cluster build): publishing without a provenance attestation"
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
