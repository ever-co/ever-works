server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit RELATIVE Location headers (`Location: /help/`) for nginx's own redirects,
    # e.g. the directory 301 that `try_files ... $uri/` issues for `/help` -> `/help/`.
    # nginx sits behind TLS-terminating proxies (Cloudflare -> ingress) and only ever
    # sees plain http on :80, so an absolute redirect came out as
    # `Location: http://docs.ever.works/help/` - an extra http:// hop that Cloudflare
    # then bounced back to https. Google Search Console reported the docs sitemap URLs
    # as "Page with redirect" because of it. A relative Location keeps the browser
    # (and Google's crawler) on the scheme and host it already used. The site itself
    # now links the slash form directly (`trailingSlash: true` in
    # apps/docs/docusaurus.config.ts), so this only governs residual redirects from
    # old slash-less links.
    absolute_redirect off;

    # Security headers, the baseline of every Ever website (ever.co). `always` sends
    # them with every status, the 301s and 404s included. nginx drops ALL server-level
    # add_header lines in a location that sets an add_header of its own, so the two
    # Cache-Control locations below repeat this set (apps/docs/test/security-headers.test.mjs
    # checks that every such location does). No HSTS here: the Cloudflare zone sends it.
    # server_tokens off keeps the nginx version out of the Server header and error pages.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Standard text-asset compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # RFC 9116 security.txt, answered by nginx itself so it does not depend on the
    # Docusaurus build copying a dot-directory out of static/. An exact-match location
    # wins over every other one, so no built file can shadow it. It sets no add_header,
    # so it inherits the set above. nginx turns each `\n` inside a quoted string into a
    # newline, so the body below is one field per line; keep `"` and `#` out of it.
    # Renew Expires before 2027-11-19 (the test fails after). No Policy field (optional in
    # RFC 9116): ever-co/ever-works has no SECURITY.md, so its policy page is empty. Add
    # `Policy: <url>` once a policy is published.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
        return 200 "Contact: mailto:security@ever.co\nExpires: 2027-11-19T00:00:00.000Z\nPreferred-Languages: en\nCanonical: https://docs.ever.works/.well-known/security.txt\n";
    }

    # Long cache for hashed/static assets emitted by Docusaurus
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # Its own add_header above drops the server-level set, so it is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        try_files $uri =404;
    }

    # No cache for HTML so deploys ship instantly
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # Its own add_header above drops the server-level set, so it is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        try_files $uri =404;
    }

    # Serve clean URLs (Docusaurus emits both /foo/ and /foo/index.html)
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Custom 404 page from Docusaurus. Every 404 ends here (error_page is an internal
    # redirect), so this location's headers are the ones a 404 carries. A 404 must never
    # be cached: during a roll the old pod answers 404 for the new build's hashed
    # `runtime~main.<hash>.js`, and without a Cache-Control of its own Cloudflare cached
    # that 404 at the edge and browsers kept it for the zone's 4 h Browser Cache TTL, so
    # docs pages did not hydrate for up to 4 h. `no-store` keeps the edge and browsers
    # from storing it; hits are unchanged (same fix as the other Ever docs sites,
    # 2026-11-21).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        # Its own add_header above drops the server-level set, so it is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }
}
